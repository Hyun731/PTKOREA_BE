[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ptk-research-deck"
version = "0.1.0"
description = "Brand marketing research -> evidence-bound editable PPTX (PRD 3.2)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "python-pptx>=1.0.2",
  "pillow>=10.4",
  "python-multipart>=0.0.9",
  "celery>=5.4",
  "redis>=5.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ptk = "core.cli:main"

[tool.setuptools.packages.find]
include = ["core*", "app*", "workers*", "integrations*"]

[tool.setuptools.package-data]
"core.rules" = ["rules_config.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
